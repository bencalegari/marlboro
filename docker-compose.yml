services:


  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:10.11
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    network_mode: host
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./services/jellyfin/config:/config
      - /mnt/tank/media:/media
    devices:
      - /dev/dri:/dev/dri


  plex:
    container_name: plex
    image: lscr.io/linuxserver/plex
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./services/plex/config:/config
      - /mnt/tank/media:/media
    devices:
      - /dev/dri:/dev/dri


  adguard:
    container_name: adguard
    image: adguard/adguardhome
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./services/adguard/work:/opt/adguardhome/work
      - ./services/adguard/conf:/opt/adguardhome/conf


  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
      - LOG_LEVEL=info
    ports:
      - "8191:8191"


  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./services/prowlarr/config:/config
    ports:
      - "9696:9696"


  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./services/radarr/config:/config
      - /mnt/tank:/data
    ports:
      - "7878:7878"


  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./services/sonarr/config:/config
      - /mnt/tank:/data
    ports:
      - "8989:8989"


  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./services/bazarr/config:/config
      - /mnt/tank/media/movies:/movies
      - /mnt/tank/media/tv:/tv
    ports:
      - "6767:6767"


  profilarr:
    container_name: profilarr
    image: ghcr.io/dictionarry-hub/profilarr:2.0.9@sha256:7a9b5112ff227320d17c65ab643a5d875713e6235991ef04a8e482ec51427902
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./services/profilarr/config:/config
    ports:
      - "6868:6868"


  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - TZ=America/Los_Angeles
      - LOG_LEVEL=info
    volumes:
      - ./services/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

  sms-bridge:
    container_name: sms-bridge
    image: python:3.13-slim@sha256:ffb752e139c0a19692a43af8d8523b274222dd68eebad5d583b45c2201c6e30a
    command: python -u /app/bridge.py
    init: true
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
      - SEERR_URL=http://seerr:5055
      - SEERR_SETTINGS=/seerr-settings.json
      - SMS_DB=/app/data/bridge.db
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - SMS_ALLOWLIST=${SMS_ALLOWLIST}
      - SMS_BRIDGE_HOOK_SECRET=${SMS_BRIDGE_HOOK_SECRET}
      - SMS_BRIDGE_PUBLIC_URL=${SMS_BRIDGE_PUBLIC_URL}
      - SMS_DAILY_CAP=${SMS_DAILY_CAP}
    volumes:
      - ./services/sms-bridge:/app
      - ./services/jellyseerr/config/settings.json:/seerr-settings.json:ro
    ports:
      - "8195:8080"
    depends_on:
      - seerr
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=3).read()==b'ok' else 1)\""]
      start_period: 10s
      timeout: 5s
      interval: 30s
      retries: 3

  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:2.26.0@sha256:a6d335064ae927c4dbef118e1fa39656b3d2e01472b2a82af5915d5cebfe815f
    command: serve
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./services/ntfy/config:/etc/ntfy
      - ./services/ntfy/cache:/var/cache/ntfy
    ports:
      - "8194:80"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health 2>/dev/null | grep -q '\"healthy\":true' || exit 1"]
      start_period: 10s
      timeout: 5s
      interval: 30s
      retries: 3


  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8080
    volumes:
      - ./services/qbittorrent/config:/config
      - /mnt/tank:/data
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "8181:8080"


  flood:
    container_name: flood
    image: jesec/flood:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    user: "1000:1000"
    networks:
      - homelab
    environment:
      - HOME=/data
      - FLOOD_OPTION_host=0.0.0.0
      - FLOOD_OPTION_rundir=/data
      - FLOOD_OPTION_auth=none
      - FLOOD_OPTION_qburl=http://qbittorrent:8080
      - FLOOD_OPTION_qbuser=admin
      - FLOOD_OPTION_qbpass=${QBIT_PASSWORD}
      - FLOOD_OPTION_allowedpath=/downloads
    volumes:
      - ./services/flood/data:/data
      - /mnt/tank/downloads:/downloads
    ports:
      - "3004:3000"
    depends_on:
      - qbittorrent


  unpackerr:
    container_name: unpackerr
    image: golift/unpackerr
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    user: "1000:1000"
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/downloads
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/downloads
    volumes:
      - /mnt/tank:/data
    depends_on:
      - sonarr
      - radarr


  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v3.0.1
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - /mnt/tank/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-postgres
    devices:
      - /dev/dri:/dev/dri

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.1
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./services/immich/model-cache:/cache

  immich-redis:
    container_name: immich-redis
    image: redis:6.2-alpine
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab

  immich-postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    shm_size: 128mb
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - homelab
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=immich
    volumes:
      - ./services/immich/postgres:/var/lib/postgresql/data


  romm-db:
    container_name: romm-db
    image: mariadb:12
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - MARIADB_ROOT_PASSWORD=${ROMM_ROOT_PASSWORD}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${ROMM_DB_PASSWORD}
    volumes:
      - ./services/romm/db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  romm:
    container_name: romm
    image: rommapp/romm:4
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_SECRET_KEY}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD}
    volumes:
      - /mnt/tank/media/roms:/romm/library
      - ./services/romm/resources:/romm/resources
      - ./services/romm/assets:/romm/assets
      - ./services/romm/config:/romm/config
    ports:
      - "7070:8080"
    depends_on:
      romm-db:
        condition: service_healthy


  pterodactyl-db:
    container_name: pterodactyl-db
    image: mariadb:11
    restart: unless-stopped
    networks:
      - homelab
    environment:
      - MARIADB_ROOT_PASSWORD=${PTERO_DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=panel
      - MARIADB_USER=pterodactyl
      - MARIADB_PASSWORD=${PTERO_DB_PASSWORD}
    volumes:
      - ./services/pterodactyl/db:/var/lib/mysql
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  pterodactyl-cache:
    container_name: pterodactyl-cache
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - homelab
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  pterodactyl-panel:
    container_name: pterodactyl-panel
    image: ghcr.io/pterodactyl/panel:v1.15.1
    restart: unless-stopped
    networks:
      - homelab
    extra_hosts:
      - "marlboro.tail314238.ts.net:host-gateway"
    environment:
      - TZ=America/Los_Angeles
      - APP_URL=http://marlboro.tail314238.ts.net:8091
      - APP_ENV=production
      - APP_ENVIRONMENT_ONLY=false
      - APP_TIMEZONE=America/Los_Angeles
      - APP_KEY=${PTERO_APP_KEY}
      - APP_SERVICE_AUTHOR=bencalegari@navapbc.com
      - HASHIDS_SALT=${PTERO_HASHIDS_SALT}
      - DB_HOST=pterodactyl-db
      - DB_PORT=3306
      - DB_DATABASE=panel
      - DB_USERNAME=pterodactyl
      - DB_PASSWORD=${PTERO_DB_PASSWORD}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=pterodactyl-cache
      - REDIS_PORT=6379
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=noreply@marlboro-bc.duckdns.org
      - RECAPTCHA_ENABLED=false
    volumes:
      - ./services/pterodactyl/panel-var:/app/var
      - ./services/pterodactyl/panel-logs:/app/storage/logs
    ports:
      - "8091:80"
    depends_on:
      pterodactyl-db:
        condition: service_healthy
      pterodactyl-cache:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/auth/login || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 5

  wings:
    container_name: wings
    image: ghcr.io/pterodactyl/wings:v1.13.3
    restart: unless-stopped
    networks:
      - homelab
    extra_hosts:
      - "marlboro.tail314238.ts.net:host-gateway"
    tty: true
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/tank/pterodactyl:/mnt/tank/pterodactyl
      - /tmp/pterodactyl:/tmp/pterodactyl
      - /mnt/tank/docker/containers:/mnt/tank/docker/containers
      - /run/wings:/run/wings
      - ./services/pterodactyl/wings-etc:/etc/pterodactyl
      - /etc/ssl/certs:/etc/ssl/certs:ro
    ports:
      - "8092:8092"
      - "2022:2022"
    depends_on:
      pterodactyl-panel:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=false

  valheim-joincode:
    container_name: valheim-joincode
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    restart: unless-stopped
    networks:
      - homelab
    depends_on:
      - wings
      - ntfy
    environment:
      - TZ=America/Los_Angeles
      - VALHEIM_UUID=0fe911ae-87fb-40ea-a1f9-eec00498c5b8
      - NTFY_TOPIC=valheim
      - POLL_SECONDS=60
    volumes:
      - ./services/valheim-joincode/watch.py:/watch.py:ro
      - ./services/pterodactyl/wings-etc:/etc/pterodactyl:ro
      - ./services/valheim-joincode/www:/srv
    command: ["python3", "-u", "/watch.py"]
    labels:
      - com.centurylinklabs.watchtower.enable=false

  valheim-autoupdate:
    container_name: valheim-autoupdate
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    restart: unless-stopped
    networks:
      - homelab
    depends_on:
      - wings
    environment:
      - TZ=America/Los_Angeles
      - VALHEIM_UUID=0fe911ae-87fb-40ea-a1f9-eec00498c5b8
      - RESTART_AT=03:00
      - WINDOW_MINUTES=180
      - POLL_SECONDS=300
    volumes:
      - ./services/valheim-autoupdate/guard.py:/guard.py:ro
      - ./services/pterodactyl/wings-etc:/etc/pterodactyl:ro
      - ./services/valheim-autoupdate/state:/srv
    command: ["python3", "-u", "/guard.py"]
    labels:
      - com.centurylinklabs.watchtower.enable=false


  portainer:
    container_name: portainer
    image: portainer/portainer-ce
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services/portainer/config:/data
    ports:
      - "9000:9000"


  nginx-proxy-manager:
    container_name: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - INITIAL_ADMIN_EMAIL=${NGINX_EMAIL_ID}
      - INITIAL_ADMIN_PASSWORD=${NGINX_PASSWORD}
    volumes:
      - ./services/nginx-proxy-manager/config:/data
      - ./services/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
      - "81:81"


  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    cap_add:
      - SYS_RAWIO
    volumes:
      - /run/udev:/run/udev:ro
      - ./services/scrutiny/config:/opt/scrutiny/config
      - ./services/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
    ports:
      - "8085:8080"


  watchtower:
    container_name: watchtower
    image: containrrr/watchtower:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_SCOPE=homelab
      - TZ=America/Los_Angeles
      - DOCKER_API_VERSION=1.55


  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    volumes:
      - ./services/uptime-kuma:/app/data
    ports:
      - "3002:3001"


  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - APP_URL=http://192.168.0.10:8765
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 */6 * * *
      - SPEEDTEST_SERVERS=
    volumes:
      - ./services/speedtest-tracker/config:/config
    ports:
      - "8765:80"

  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY}
      - TAILSCALE_HOSTNAME=${TAILSCALE_HOSTNAME}
      - NGINX_PROXY_URL=${NGINX_PROXY_URL}
      - NGINX_EMAIL_ID=${NGINX_EMAIL_ID}
      - NGINX_PASSWORD=${NGINX_PASSWORD}
      - SPEEDTEST_URL=${SPEEDTEST_URL}
      - SPEEDTEST_TRACKER_API_TOKEN=${SPEEDTEST_TRACKER_API_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PTERO_CLIENT_API_KEY=${PTERO_CLIENT_API_KEY}
    volumes:
      - ./services/glance/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /mnt/tank:/mnt/tank:ro
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          recursive: disabled
    ports:
      - "8080:8080"
    depends_on:
      - jellyfin
      - plex
      - adguard
      - prowlarr
      - radarr
      - sonarr
      - qbittorrent
      - flood
      - immich-server
      - seerr
      - speedtest-tracker



  coolify-db:
    container_name: coolify-db
    profiles: [coolify]
    image: postgres:15-alpine
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - POSTGRES_USER=coolify
      - POSTGRES_PASSWORD=${COOLIFY_DB_PASSWORD}
      - POSTGRES_DB=coolify
    volumes:
      - ./services/coolify/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coolify -d coolify"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  coolify-redis:
    container_name: coolify-redis
    profiles: [coolify]
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    command: redis-server --requirepass ${COOLIFY_REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - ./services/coolify/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${COOLIFY_REDIS_PASSWORD}", "ping"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  coolify-realtime:
    container_name: coolify-realtime
    profiles: [coolify]
    image: ghcr.io/coollabsio/coolify-realtime:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - homelab
    ports:
      - "6001:6001"
      - "6002:6002"
    environment:
      - PUSHER_APP_ID=${COOLIFY_PUSHER_APP_ID}
      - PUSHER_APP_KEY=${COOLIFY_PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${COOLIFY_PUSHER_APP_SECRET}

  coolify:
    container_name: coolify
    profiles: [coolify]
    image: ghcr.io/coollabsio/coolify:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - homelab
      - coolify
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/docker.sock:/var/run/docker.sock.host
      - /data/coolify/source:/data/coolify/source
      - ./services/coolify/app:/data/coolify
      - ./services/coolify/ssh:/var/www/html/.ssh
    environment:
      - APP_KEY=${COOLIFY_APP_KEY}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://coolify.marlboro-bc.duckdns.org
      - DB_CONNECTION=pgsql
      - DB_HOST=coolify-db
      - DB_PORT=5432
      - DB_DATABASE=coolify
      - DB_USERNAME=coolify
      - DB_PASSWORD=${COOLIFY_DB_PASSWORD}
      - REDIS_HOST=coolify-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${COOLIFY_REDIS_PASSWORD}
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - CACHE_DRIVER=redis
      - PUSHER_HOST=coolify-realtime
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
      - PUSHER_APP_ID=${COOLIFY_PUSHER_APP_ID}
      - PUSHER_APP_KEY=${COOLIFY_PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${COOLIFY_PUSHER_APP_SECRET}
      - DISABLE_STANDALONE_MODE=true
    ports:
      - "8000:8080"
    depends_on:
      coolify-db:
        condition: service_healthy
      coolify-redis:
        condition: service_healthy
      coolify-realtime:
        condition: service_started


  forgejo:
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:11
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=America/Los_Angeles
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__server__DOMAIN=git.marlboro-bc.duckdns.org
      - FORGEJO__server__ROOT_URL=https://git.marlboro-bc.duckdns.org/
      - FORGEJO__server__SSH_DOMAIN=git.marlboro-bc.duckdns.org
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__LFS_START_SERVER=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
    volumes:
      - ./services/forgejo/data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3003:3000"
      - "2222:22"


  duckdns:
    container_name: duckdns
    image: lscr.io/linuxserver/duckdns
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=homelab
    networks:
      - homelab
    environment:
      - TZ=America/Los_Angeles
      - SUBDOMAINS=marlboro-bc
      - TOKEN=${DUCKDNS_TOKEN}

networks:
  homelab:
    driver: bridge
  coolify:
    external: true
    name: coolify
