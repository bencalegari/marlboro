          # ── Tailscale devices
          - type: custom-api
            title: Tailscale Devices
            title-url: https://login.tailscale.com/admin/machines
            cache: 5m
            url: https://api.tailscale.com/api/v2/tailnet/-/devices
            headers:
              Authorization: Bearer ${TAILSCALE_API_KEY}
            template: |
              <style>
                .ts-row { display: flex; align-items: center; gap: 8px; }
                .ts-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
                .ts-dot-on { background-color: var(--color-positive); }
                .ts-dot-off { background-color: var(--color-negative); }
              </style>
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="6">
                {{ range .JSON.Array "devices" }}
                <li>
                  <div class="ts-row">
                    <span class="size-h4 block text-truncate color-primary grow">
                      {{ findMatch "^([^.]+)" (.String "name") }}
                    </span>
                    {{ $lastSeen := .String "lastSeen" | parseTime "rfc3339" }}
                    {{ if $lastSeen.After (offsetNow "-10s") }}
                      <span class="ts-dot ts-dot-on" data-popover-type="text" data-popover-text="Online"></span>
                    {{ else }}
                      <span class="ts-dot ts-dot-off" data-popover-type="text"
                        data-popover-text="Offline — last seen {{ ($lastSeen.In now.Location).Format "Jan 2 3:04pm" }}"></span>
                    {{ end }}
                  </div>
                  <ul class="list-horizontal-text">
                    <li>{{ .String "os" }}</li>
                    <li>{{ .String "addresses.0" }}</li>
                  </ul>
                </li>
                {{ end }}
              </ul>

          - type: releases
            cache: 6h
            # Authenticated GitHub requests lift the anonymous 60/hr rate limit to
            # 5000/hr. All repos below are public, so read access is enough.
            token: ${GITHUB_TOKEN}
            repositories:
              - glanceapp/glance
              - jellyfin/jellyfin
              - linuxserver/docker-plex
              - LizardByte/Sunshine
              - AdguardTeam/AdGuardHome
              - linuxserver/docker-prowlarr
              - Radarr/Radarr
              - Sonarr/Sonarr
              - morpheus65535/bazarr
              - Dictionarry-Hub/profilarr
              - seerr-team/seerr
              - qbittorrent/qBittorrent
              - jesec/flood
              - immich-app/immich
              - rommapp/romm
              - louislam/uptime-kuma
              - portainer/portainer
              - containrrr/watchtower
